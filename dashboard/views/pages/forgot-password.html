<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ESP32-S3 Manager</title>
    <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 12px; }
        .card { max-width: 420px; width: 100%; border: none; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); }
        .card-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-align: center; padding: 16px 20px; border-radius: 10px 10px 0 0; border: none; }
        .card-header i { font-size: 1.75rem; display: block; margin-bottom: 4px; }
        .card-body { padding: 18px 20px; background: white; border-radius: 0 0 10px 10px; }
        .btn-submit { width: 100%; min-height: 44px; padding: 8px 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; color: white; font-weight: 600; border-radius: 8px; }
        .btn-submit:hover { opacity: 0.9; color: white; }
    </style>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="card">
        <div class="card-header">
            <i class="bi bi-key"></i>
            <h5 class="mb-1">Forgot Password</h5>
            <small class="opacity-75">Enter your email to receive a reset link</small>
        </div>
        <div class="card-body">
            <% if (error_msg && error_msg.length > 0) { %>
                <div class="alert alert-danger alert-dismissible fade show"><%= error_msg %><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
            <% } %>
            <% if (success_msg && success_msg.length > 0) { %>
                <div class="alert alert-success"><i class="bi bi-check-circle me-2"></i><%= success_msg %></div>
            <% } %>
            <form action="/auth/forgot-password" method="POST">
                <input type="hidden" name="_csrf" value="<%= csrfToken || '' %>">
                <div class="mb-4">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="admin@example.com" required>
                </div>
                <button type="submit" class="btn btn-submit">
                    <i class="bi bi-envelope me-2"></i>Send Reset Link
                </button>
            </form>
            <div class="text-center mt-3">
                <a href="/auth/login" class="text-muted small">Back to login</a>
            </div>
        </div>
    </div>
    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
