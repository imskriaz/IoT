<div class="container-fluid px-0 esp32-console-page">
    <div class="d-flex flex-column flex-xl-row justify-content-between align-items-start align-items-xl-center mb-2 gap-2">
        <div>
            <h2 class="mb-0 fs-5">
                <i class="bi bi-terminal me-2 text-primary"></i>Console
            </h2>
            <small class="text-muted">Logs plus manual MQTT and Serial command lanes</small>
        </div>
        <div class="d-flex flex-wrap gap-2 align-items-center">
            <span class="badge text-bg-light border" id="esp32ConsoleDeviceBadge">Device: <%= deviceId || '--' %></span>
            <span class="badge <%= initialMqttConnected ? 'text-bg-success' : 'text-bg-secondary' %>" id="esp32ConsoleMqttBadge">MQTT: <%= initialMqttConnected ? 'connected' : 'checking' %></span>
            <span class="badge text-bg-secondary" id="esp32ConsoleSerialBadge">Serial: idle</span>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="esp32ConsoleClearBtn" title="Clear current view">
                <i class="bi bi-eraser"></i>
            </button>
            <button type="button" class="btn btn-sm btn-outline-primary" id="esp32ConsoleExportBtn" title="Export events">
                <i class="bi bi-download"></i>
            </button>
        </div>
    </div>

    <ul class="nav nav-tabs console-tabs mb-2" role="tablist" aria-label="Console tabs">
        <li class="nav-item" role="presentation">
            <button type="button" class="nav-link active" data-console-tab="system" role="tab" aria-selected="true">
                <i class="bi bi-journal-text me-1"></i>Logs
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button type="button" class="nav-link" data-console-tab="serial" role="tab" aria-selected="false">
                <i class="bi bi-usb-symbol me-1"></i>Serial
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button type="button" class="nav-link" data-console-tab="mqtt" role="tab" aria-selected="false">
                <i class="bi bi-broadcast-pin me-1"></i>MQTT
            </button>
        </li>
    </ul>
    <div class="tab-context small text-muted mb-2" id="esp32ConsoleTabHint"></div>

    <div class="row g-2">
        <div class="col-12">
            <section class="system-log-panel mb-2" id="esp32SystemLogPanel">
                <div class="d-flex flex-column flex-lg-row justify-content-between gap-2 align-items-lg-end">
                    <ul class="nav nav-pills console-subtabs" role="tablist" aria-label="System log sources">
                        <li class="nav-item" role="presentation">
                            <button type="button" class="nav-link active" data-system-log-source="app" role="tab" aria-selected="true">
                                <i class="bi bi-server me-1"></i>App <span class="badge text-bg-secondary ms-1" id="esp32SystemAppCount">0</span>
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button type="button" class="nav-link" data-system-log-source="mqtt" role="tab" aria-selected="false">
                                <i class="bi bi-broadcast me-1"></i>MQTT <span class="badge text-bg-secondary ms-1" id="esp32SystemMqttCount">0</span>
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button type="button" class="nav-link" data-system-log-source="error" role="tab" aria-selected="false">
                                <i class="bi bi-exclamation-triangle me-1"></i>Errors <span class="badge text-bg-danger ms-1" id="esp32SystemErrorCount">0</span>
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button type="button" class="nav-link" data-system-log-source="manual" role="tab" aria-selected="false">
                                <i class="bi bi-terminal me-1"></i>Manual <span class="badge text-bg-secondary ms-1" id="esp32SystemManualCount">0</span>
                            </button>
                        </li>
                    </ul>
                    <div class="row g-2 align-items-end system-log-filters">
                        <div class="col-6 col-sm-auto">
                            <label class="form-label small mb-1" for="esp32SystemLogLevel">Level</label>
                            <select class="form-select form-select-sm" id="esp32SystemLogLevel">
                                <option value="">All</option>
                                <option value="error">Error</option>
                                <option value="warn">Warn</option>
                                <option value="info">Info</option>
                                <option value="debug">Debug</option>
                            </select>
                        </div>
                        <div class="col-6 col-sm-auto">
                            <label class="form-label small mb-1" for="esp32SystemLogLimit">Limit</label>
                            <select class="form-select form-select-sm" id="esp32SystemLogLimit">
                                <option value="50">50</option>
                                <option value="100" selected>100</option>
                                <option value="200">200</option>
                                <option value="500">500</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-auto">
                            <label class="form-label small mb-1" for="esp32SystemLogSearch">Search</label>
                            <input type="search" class="form-control form-control-sm" id="esp32SystemLogSearch" placeholder="Filter logs">
                        </div>
                    </div>
                </div>
            </section>

            <section class="console-panel mb-2">
                <div class="console-toolbar">
                    <div class="d-flex align-items-center gap-2">
                        <span class="console-dot bg-danger"></span>
                        <span class="console-dot bg-warning"></span>
                        <span class="console-dot bg-success"></span>
                        <span class="small text-white-50 ms-1" id="esp32ConsoleSessionLabel">console</span>
                    </div>
                    <div class="small text-white-50" id="esp32ConsoleLastRun">idle</div>
                </div>
                <div class="console-events" id="esp32ConsoleOutput" aria-live="polite">
                    <button type="button" class="console-event text-success" data-entry-index="0">
                        <span class="event-time">ready</span>
                        <span class="event-source">ready</span>
                        <span class="event-message">Console ready.</span>
                    </button>
                </div>
            </section>

            <section class="command-panel" id="esp32CommandPanel">
                <div class="row g-2 align-items-end">
                    <div class="col-6 col-lg-3">
                        <label class="form-label small mb-1" for="esp32CommandModeSelect">Mode</label>
                        <select class="form-select form-select-sm" id="esp32CommandModeSelect">
                            <option value="command" selected>Command</option>
                            <option value="action">Action</option>
                            <option value="function">Function</option>
                            <option value="chain">Chain</option>
                        </select>
                    </div>

                    <div class="col-12 col-lg-9 picker-row">
                        <label class="form-label small mb-1" for="esp32CommandPresetSelect" id="esp32CommandPresetLabel">Command</label>
                        <select class="form-select form-select-sm" id="esp32CommandPresetSelect"></select>
                    </div>
                    <div class="col-12 command-line-row">
                        <label class="form-label small mb-1" for="esp32CommandLineInput">Command line</label>
                        <input type="text" class="form-control form-control-sm command-line-input" id="esp32CommandLineInput" spellcheck="false" autocomplete="off">
                    </div>
                    <div class="col-12">
                        <div class="command-description small" id="esp32OptionDetails"></div>
                    </div>

                    <div class="col-6 col-lg-2 mqtt-control">
                        <label class="form-label small mb-1" for="esp32TimeoutInput">Timeout</label>
                        <input type="number" class="form-control form-control-sm" id="esp32TimeoutInput" value="30000" min="1000" max="120000" step="1000">
                    </div>
                    <div class="col-6 col-lg-2 mqtt-control">
                        <label class="form-label small mb-1" for="esp32WaitSelect">Response</label>
                        <select class="form-select form-select-sm" id="esp32WaitSelect">
                            <option value="true" selected>Wait</option>
                            <option value="false">Publish</option>
                        </select>
                    </div>
                    <div class="col-6 col-lg-2 serial-control">
                        <label class="form-label small mb-1" for="esp32SerialBaudSelect">Baud</label>
                        <select class="form-select form-select-sm" id="esp32SerialBaudSelect">
                            <option value="115200" selected>115200</option>
                            <option value="9600">9600</option>
                            <option value="57600">57600</option>
                            <option value="921600">921600</option>
                        </select>
                    </div>
                    <div class="col-6 col-lg-2 serial-control">
                        <label class="form-label small mb-1" for="esp32SerialLineEndingSelect">Ending</label>
                        <select class="form-select form-select-sm" id="esp32SerialLineEndingSelect">
                            <option value="crlf" selected>CRLF</option>
                            <option value="lf">LF</option>
                            <option value="cr">CR</option>
                            <option value="none">None</option>
                        </select>
                    </div>
                    <div class="col-12 col-lg-2 d-grid serial-control">
                        <button type="button" class="btn btn-outline-primary btn-sm" id="esp32SerialConnectBtn">
                            <i class="bi bi-usb-symbol"></i> Connect
                        </button>
                    </div>

                    <div class="col-12 chain-command-row">
                        <label class="form-label small mb-1" for="esp32ChainInput">Command chain</label>
                        <textarea class="form-control console-payload compact-chain" id="esp32ChainInput" rows="4" spellcheck="false">AT
AT+CPIN?
AT+CSQ</textarea>
                    </div>

                    <div class="col-12 mqtt-control" id="esp32PayloadPanel">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label small mb-0" for="esp32PayloadInput">Payload JSON</label>
                            <button type="button" class="btn btn-sm btn-link py-0 px-1" id="esp32FormatPayloadBtn">Format</button>
                        </div>
                        <textarea class="form-control console-payload" id="esp32PayloadInput" rows="4" spellcheck="false">{}</textarea>
                    </div>

                    <div class="col-12 d-grid">
                        <button type="button" class="btn btn-primary btn-sm" id="esp32SendCommandBtn">
                            <i class="bi bi-send"></i> Send
                        </button>
                    </div>

                    <div class="col-12">
                        <div class="command-result" id="esp32CommandResultPanel">
                            <div class="d-flex justify-content-between align-items-center gap-2 mb-1">
                                <span class="small fw-semibold" id="esp32CommandResultTitle">
                                    <i class="bi bi-clipboard-check me-1"></i>Result
                                </span>
                                <span class="badge text-bg-secondary" id="esp32CommandResultBadge">idle</span>
                            </div>
                            <div class="small command-result-summary" id="esp32CommandResultSummary">No result yet.</div>
                            <pre class="command-result-json mb-0" id="esp32CommandResultJson">{}</pre>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

<div class="modal fade" id="esp32EventDetailModal" tabindex="-1" aria-labelledby="esp32EventDetailTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h5 class="modal-title fs-6" id="esp32EventDetailTitle">Event details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <dl class="row small mb-2" id="esp32EventDetailSummary"></dl>
                <pre class="event-detail-json mb-0" id="esp32EventDetailJson"></pre>
            </div>
        </div>
    </div>
</div>

<style>
.esp32-console-page .console-panel,
.esp32-console-page .command-panel,
.esp32-console-page .system-log-panel {
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 8px;
    background: var(--bs-body-bg);
}

.esp32-console-page .console-panel {
    overflow: hidden;
}

.esp32-console-page .console-toolbar {
    min-height: 30px;
    padding: 0.35rem 0.6rem;
    background: #20242a;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.esp32-console-page .console-dot {
    width: 0.56rem;
    height: 0.56rem;
    border-radius: 50%;
    display: inline-block;
}

.esp32-console-page .console-events {
    min-height: 260px;
    max-height: 42vh;
    overflow: auto;
    background: #101418;
    color: #e6edf3;
    font-family: Consolas, "Liberation Mono", monospace;
    font-size: 0.78rem;
    line-height: 1.3;
    padding: 0.35rem;
}

.esp32-console-page.is-logs-tab .console-events {
    min-height: 520px;
    max-height: 78vh;
}

.esp32-console-page.is-mqtt-tab .serial-control,
.esp32-console-page.is-serial-tab .mqtt-control,
.esp32-console-page.is-logs-tab .serial-control,
.esp32-console-page.is-logs-tab .mqtt-control {
    display: none !important;
}

.esp32-console-page .console-event {
    width: 100%;
    display: grid;
    grid-template-columns: 72px 82px minmax(0, 1fr);
    gap: 0.45rem;
    align-items: center;
    border: 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.055);
    background: transparent;
    color: inherit;
    text-align: left;
    padding: 0.25rem 0.2rem;
}

.esp32-console-page .console-event:hover,
.esp32-console-page .console-event:focus {
    background: rgba(255, 255, 255, 0.06);
    outline: none;
}

.esp32-console-page .event-time,
.esp32-console-page .event-source {
    color: #9aa7b6;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.esp32-console-page .event-message {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.esp32-console-page .command-panel {
    padding: 0.65rem;
}

.esp32-console-page .system-log-panel {
    padding: 0.55rem 0.65rem;
}

.esp32-console-page .console-tabs .nav-link {
    padding: 0.36rem 0.7rem;
    font-size: 0.86rem;
}

.esp32-console-page .console-subtabs .nav-link {
    padding: 0.3rem 0.58rem;
    font-size: 0.8rem;
}

.esp32-console-page .system-log-filters {
    width: auto;
}

.esp32-console-page .tab-context {
    min-height: 1.2rem;
}

.esp32-console-page .console-payload {
    font-family: Consolas, "Liberation Mono", monospace;
    font-size: 0.82rem;
    resize: vertical;
}

.esp32-console-page .command-line-input {
    font-family: Consolas, "Liberation Mono", monospace;
    font-size: 0.82rem;
}

.esp32-console-page .compact-chain {
    min-height: 92px;
}

.esp32-console-page .command-description {
    min-height: 42px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 6px;
    padding: 0.45rem 0.55rem;
    background: rgba(13, 110, 253, 0.04);
}

.esp32-console-page .command-description dl {
    display: grid;
    grid-template-columns: minmax(80px, auto) minmax(0, 1fr);
    column-gap: 0.75rem;
    row-gap: 0.18rem;
}

.esp32-console-page .command-description dt,
.esp32-console-page .command-description dd {
    margin-bottom: 0;
}

.esp32-console-page .command-description dd {
    min-width: 0;
}

.esp32-console-page .command-description code {
    word-break: break-word;
}

.esp32-console-page .command-result {
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 6px;
    background: rgba(25, 135, 84, 0.04);
    padding: 0.5rem 0.55rem;
}

.esp32-console-page .command-result-summary {
    color: var(--bs-secondary-color);
    margin-bottom: 0.35rem;
}

.esp32-console-page .command-result-json {
    min-height: 72px;
    max-height: 180px;
    overflow: auto;
    background: #101418;
    color: #e6edf3;
    border-radius: 5px;
    padding: 0.5rem;
    font-family: Consolas, "Liberation Mono", monospace;
    font-size: 0.78rem;
}

.event-detail-json {
    max-height: 55vh;
    overflow: auto;
    background: #101418;
    color: #e6edf3;
    border-radius: 6px;
    padding: 0.75rem;
    font-size: 0.82rem;
}

[data-bs-theme="dark"] .esp32-console-page .console-panel,
[data-bs-theme="dark"] .esp32-console-page .command-panel,
[data-bs-theme="dark"] .esp32-console-page .system-log-panel {
    border-color: rgba(255, 255, 255, 0.12);
}

[data-bs-theme="dark"] .esp32-console-page .command-description {
    border-color: rgba(255, 255, 255, 0.12);
    background: rgba(13, 110, 253, 0.08);
}

[data-bs-theme="dark"] .esp32-console-page .command-result {
    border-color: rgba(255, 255, 255, 0.12);
    background: rgba(25, 135, 84, 0.08);
}

@media (max-width: 767.98px) {
    .esp32-console-page .console-events {
        min-height: 220px;
        max-height: 38vh;
    }

    .esp32-console-page.is-logs-tab .console-events {
        min-height: 440px;
        max-height: 68vh;
    }

    .esp32-console-page .console-event {
        grid-template-columns: 64px 70px minmax(0, 1fr);
    }
}
</style>
