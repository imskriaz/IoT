<div class="d-flex flex-column flex-lg-row justify-content-between align-items-start align-items-lg-center gap-3 mb-4">
    <div>
        <h2 class="mb-1"><i class="bi bi-credit-card-2-front me-2"></i>Payment Gateways</h2>
        <p class="text-muted mb-0">Manage the payment methods shown on the landing page and used for device package checkout instructions.</p>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary" type="button" onclick="loadGatewayAdmin()">
            <i class="bi bi-arrow-repeat me-2"></i>Refresh
        </button>
        <button class="btn btn-primary" type="button" onclick="saveGatewayAdmin()">
            <i class="bi bi-check-lg me-2"></i>Save Gateways
        </button>
    </div>
</div>

<div class="card">
    <div class="card-header bg-body py-3 d-flex justify-content-between align-items-center">
        <div>
            <h5 class="mb-1"><i class="bi bi-wallet2 me-2"></i>Gateway Catalog</h5>
            <div class="small text-muted">Enable one or more gateways for package checkout instructions.</div>
        </div>
        <button class="btn btn-sm btn-outline-primary" type="button" onclick="addGatewayRow()">
            <i class="bi bi-plus-lg me-1"></i>Add Gateway
        </button>
    </div>
    <div class="card-body">
        <div id="gatewayList" class="d-grid gap-3">
            <div class="text-muted">Loading gateways...</div>
        </div>
    </div>
</div>

<style>
.gateway-card {
    border: 1px solid var(--bs-border-color);
    border-radius: 1rem;
    padding: 1rem;
    background: linear-gradient(180deg, rgba(15,118,110,0.05), rgba(15,118,110,0.015));
}
</style>

<script>
let paymentGateways = [];

function gatewayEscape(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function renderGatewayList() {
    const list = document.getElementById('gatewayList');
    if (!list) return;
    if (!paymentGateways.length) {
        list.innerHTML = '<div class="text-muted">No payment gateways configured.</div>';
        return;
    }

    list.innerHTML = paymentGateways.map((gateway, index) => `
        <div class="gateway-card">
            <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
                <div>
                    <div class="fw-semibold">${gatewayEscape(gateway.name || 'Gateway')}</div>
                    <div class="small text-muted">${gatewayEscape(gateway.code || 'gateway')}</div>
                </div>
                <div class="d-flex gap-2">
                    <div class="form-check form-switch m-0">
                        <input class="form-check-input" type="checkbox" ${gateway.enabled ? 'checked' : ''} onchange="updateGatewayField(${index}, 'enabled', this.checked)">
                    </div>
                    <button class="btn btn-sm btn-outline-danger" type="button" onclick="removeGatewayRow(${index})">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label small fw-semibold">Code</label>
                    <input class="form-control form-control-sm" value="${gatewayEscape(gateway.code || '')}" onchange="updateGatewayField(${index}, 'code', this.value)">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold">Name</label>
                    <input class="form-control form-control-sm" value="${gatewayEscape(gateway.name || '')}" onchange="updateGatewayField(${index}, 'name', this.value)">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold">Account Number</label>
                    <input class="form-control form-control-sm" value="${gatewayEscape(gateway.account_number || '')}" onchange="updateGatewayField(${index}, 'account_number', this.value)">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold">Account Type</label>
                    <input class="form-control form-control-sm" value="${gatewayEscape(gateway.account_type || '')}" onchange="updateGatewayField(${index}, 'account_type', this.value)">
                </div>
                <div class="col-12">
                    <label class="form-label small fw-semibold">Instructions</label>
                    <textarea class="form-control form-control-sm" rows="2" onchange="updateGatewayField(${index}, 'instructions', this.value)">${gatewayEscape(gateway.instructions || '')}</textarea>
                </div>
            </div>
        </div>
    `).join('');
}

function updateGatewayField(index, key, value) {
    paymentGateways[index][key] = value;
    renderGatewayList();
}

function addGatewayRow() {
    paymentGateways.push({
        code: '',
        name: '',
        enabled: false,
        account_number: '',
        account_type: '',
        instructions: ''
    });
    renderGatewayList();
}

function removeGatewayRow(index) {
    paymentGateways.splice(index, 1);
    renderGatewayList();
}

async function loadGatewayAdmin() {
    try {
        const response = await fetch('/admin/api/gateway', { cache: 'no-store' });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || payload.success === false) {
            throw new Error(payload.message || 'Failed to load payment gateways');
        }
        paymentGateways = Array.isArray(payload.gateways) ? payload.gateways : [];
        renderGatewayList();
    } catch (error) {
        if (window.showToast) window.showToast(error.message || 'Failed to load payment gateways', 'danger');
    }
}

async function saveGatewayAdmin() {
    try {
        const response = await fetch('/admin/api/gateway', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]')?.content || ''
            },
            body: JSON.stringify({ gateways: paymentGateways })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || payload.success === false) {
            throw new Error(payload.message || 'Failed to save payment gateways');
        }
        paymentGateways = Array.isArray(payload.gateways) ? payload.gateways : [];
        renderGatewayList();
        if (window.showToast) window.showToast('Payment gateways saved', 'success');
    } catch (error) {
        if (window.showToast) window.showToast(error.message || 'Failed to save payment gateways', 'danger');
    }
}

document.addEventListener('DOMContentLoaded', loadGatewayAdmin);
</script>
