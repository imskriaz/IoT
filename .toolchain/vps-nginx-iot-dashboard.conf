# Copy this file on the VPS to:
#   /etc/nginx/sites-available/iot-dashboard
# then symlink it:
#   sudo ln -s /etc/nginx/sites-available/iot-dashboard /etc/nginx/sites-enabled/iot-dashboard
#
# This expects the local PC to keep an SSH reverse tunnel open:
#   node .toolchain/share-vps-tunnel.js --host YOUR_VPS_IP --user root --public-url https://device.atebd.com --forward 3000:3001
# Add more ports later for chat/live services:
#   node .toolchain/share-vps-tunnel.js --host YOUR_VPS_IP --user root --forward 3000:3001,3010:3010 --reconnect

server {
    listen 80;
    server_name device.atebd.com;

    # If you use certbot, it can replace this with HTTPS redirect/cert blocks.
    # sudo certbot --nginx -d device.atebd.com

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Optional future services through the same VPS.
    # Example: local chat/live server on your PC port 3010, tunnelled to VPS 3010.
    location /chat/ {
        proxy_pass http://127.0.0.1:3010/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /live/ {
        proxy_pass http://127.0.0.1:3011/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
